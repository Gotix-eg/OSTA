name: Build Android AAB (Local)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:

jobs:
  build-android-aab-local:
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🏗 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🏗 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        run: npm install

      - name: 📦 Install mobile dependencies
        run: npm install
        working-directory: ./apps/mobile

      - name: 🚀 Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install
        working-directory: ./apps/mobile

      - name: 🔧 Ensure New Architecture is disabled
        run: |
          sed -i 's/newArchEnabled=true/newArchEnabled=false/g' android/gradle.properties
          echo "gradle.properties after patch:"
          grep "newArchEnabled" android/gradle.properties
        working-directory: ./apps/mobile

      - name: 🛠 Build AAB
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease
        working-directory: ./apps/mobile/android

      - name: 🔍 Verify Signing Secrets
        run: |
          echo "### === SECRETS VERIFICATION ===" >> $GITHUB_STEP_SUMMARY
          if [ -z "${{ secrets.ANDROID_SIGNING_KEY }}" ]; then echo "ANDROID_SIGNING_KEY is EMPTY" >> $GITHUB_STEP_SUMMARY; else echo "ANDROID_SIGNING_KEY is set (length: ${#signingKey})" >> $GITHUB_STEP_SUMMARY; fi
          if [ -z "${{ secrets.ANDROID_ALIAS }}" ]; then echo "ANDROID_ALIAS is EMPTY" >> $GITHUB_STEP_SUMMARY; else echo "ANDROID_ALIAS is set" >> $GITHUB_STEP_SUMMARY; fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then echo "ANDROID_KEYSTORE_PASSWORD is EMPTY" >> $GITHUB_STEP_SUMMARY; else echo "ANDROID_KEYSTORE_PASSWORD is set" >> $GITHUB_STEP_SUMMARY; fi
          if [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then echo "ANDROID_KEY_PASSWORD is EMPTY" >> $GITHUB_STEP_SUMMARY; else echo "ANDROID_KEY_PASSWORD is set" >> $GITHUB_STEP_SUMMARY; fi
        env:
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}

      - name: 🔏 Sign App Bundle
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: apps/mobile/android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: osta-aab-release
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
