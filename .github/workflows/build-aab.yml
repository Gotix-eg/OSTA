name: Build Android AAB (EAS)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:

jobs:
  build-android-aab:
    name: Build Android AAB for Google Play
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🏗 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🏗 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies (Workspace mode)
        run: npm install --workspace=mobile

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🚀 Build Android AAB (Local Production)
        run: eas build --platform android --profile production --local --non-interactive --output=./osta-release.aab
        working-directory: ./apps/mobile

      - name: 📤 Upload AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: osta-android-aab
          path: apps/mobile/osta-release.aab
          retention-days: 30
