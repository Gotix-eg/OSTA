<script>
        function toggleSwitch(element) {
            const circle = element.querySelector('div');
            const isActive = circle.classList.contains('translate-x-6');
            
            if (isActive) {
                circle.classList.remove('translate-x-6');
                circle.classList.add('translate-x-0');
                element.classList.remove('bg-primary-container');
                element.classList.add('bg-white/20');
            } else {
                circle.classList.remove('translate-x-0');
                circle.classList.add('translate-x-6');
                element.classList.remove('bg-white/20');
                element.classList.add('bg-primary-container');
            }
        }

        // Simple haptic feedback simulation on interactions
        document.querySelectorAll('button, input[type="checkbox"]').forEach(el => {
            el.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });
    </script>
