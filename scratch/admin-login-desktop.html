<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&amp;family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        try {
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        "colors": {
                            "primary": "#775a00",
                            "tertiary-fixed": "#e5e2e1",
                            "tertiary": "#5f5e5e",
                            "secondary-fixed-dim": "#c6c6c6",
                            "on-tertiary-container": "#525151",
                            "primary-fixed": "#ffdf9a",
                            "surface-container": "#eeeeee",
                            "secondary-fixed": "#e2e2e2",
                            "outline": "#817660",
                            "on-primary-fixed": "#251a00",
                            "surface-container-highest": "#e2e2e2",
                            "on-tertiary-fixed": "#1c1b1b",
                            "on-primary": "#ffffff",
                            "inverse-surface": "#2f3131",
                            "primary-fixed-dim": "#f6be1a",
                            "secondary": "#5e5e5e",
                            "on-background": "#1a1c1c",
                            "error-container": "#ffdad6",
                            "error": "#ba1a1a",
                            "on-error": "#ffffff",
                            "surface-variant": "#e2e2e2",
                            "on-secondary-fixed-variant": "#474747",
                            "surface-container-high": "#e8e8e8",
                            "on-surface": "#1a1c1c",
                            "surface-container-low": "#f3f3f4",
                            "on-surface-variant": "#4f4633",
                            "on-primary-fixed-variant": "#5a4300",
                            "surface-container-lowest": "#ffffff",
                            "tertiary-container": "#c7c5c4",
                            "on-primary-container": "#684e00",
                            "on-secondary-container": "#646464",
                            "background": "#0a0a0a", // Obsidian Black
                            "surface-bright": "#f9f9f9",
                            "surface": "#0a0a0a",
                            "surface-dim": "#121212",
                            "surface-tint": "#f5bd18",
                            "on-tertiary-fixed-variant": "#474646",
                            "on-secondary-fixed": "#1b1b1b",
                            "on-secondary": "#ffffff",
                            "on-error-container": "#93000a",
                            "inverse-primary": "#f6be1a",
                            "tertiary-fixed-dim": "#c8c6c5",
                            "outline-variant": "#d3c5ac",
                            "secondary-container": "#e2e2e2",
                            "inverse-on-surface": "#f0f1f1",
                            "primary-container": "#f5bd18", // OSTA Gold
                            "on-tertiary": "#ffffff"
                        },
                        "borderRadius": {
                            "DEFAULT": "0.125rem",
                            "lg": "0.25rem",
                            "xl": "0.5rem",
                            "full": "0.75rem"
                        },
                        "spacing": {
                            "margin-mobile": "16px",
                            "stack-lg": "48px",
                            "stack-sm": "12px",
                            "margin-desktop": "48px",
                            "container-max": "1280px",
                            "gutter": "24px",
                            "stack-md": "24px",
                            "base": "8px"
                        },
                        "fontFamily": {
                            "body-md": ["Inter"],
                            "display-lg": ["Outfit"],
                            "body-lg": ["Inter"],
                            "label-lg": ["Outfit"],
                            "headline-sm": ["Outfit"],
                            "headline-md": ["Outfit"],
                            "label-md": ["Outfit"],
                            "headline-lg-mobile": ["Outfit"],
                            "headline-lg": ["Outfit"]
                        },
                        "fontSize": {
                            "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                            "display-lg": ["72px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                            "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                            "label-lg": ["14px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700"}],
                            "headline-sm": ["24px", {"lineHeight": "1.4", "fontWeight": "600"}],
                            "headline-md": ["32px", {"lineHeight": "1.3", "fontWeight": "600"}],
                            "label-md": ["12px", {"lineHeight": "1", "fontWeight": "600"}],
                            "headline-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                            "headline-lg": ["48px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}]
                        }
                    }
                }
            }
        } catch (_e) {}
    </script>
<style>
        .terminal-grid {
            background-image: radial-gradient(rgba(245, 189, 24, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .obsidian-card {
            background: #111111;
            border: 1px solid rgba(245, 189, 24, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .gold-button-shadow:hover {
            box-shadow: 0 0 20px rgba(245, 189, 24, 0.4);
        }
        .system-dot {
            width: 8px;
            height: 8px;
            background-color: #f5bd18;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #f5bd18;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center relative overflow-y-auto bg-background terminal-grid">
<!-- Top Navigation (Fixed) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop py-6 border-b border-white/5 bg-background/80 backdrop-blur-md">
<div class="flex items-center gap-3">
<div class="w-2 h-8 bg-primary-container"></div>
<div class="font-headline-sm text-headline-sm font-bold text-primary-container tracking-tighter">
            OSTA ADMIN
        </div>
</div>
<div class="flex items-center gap-8">
<div class="hidden md:flex items-center gap-2 px-4 py-1.5 border border-primary-container/20 bg-primary-container/5">
<span class="system-dot"></span>
<span class="text-primary-container font-label-md text-label-md tracking-widest uppercase">System Status: Optimal</span>
</div>
<div class="flex items-center gap-6 text-white">
<span class="material-symbols-outlined text-[20px] cursor-pointer hover:text-primary-container transition-colors" title="Security Protocols">lock</span>
<span class="material-symbols-outlined text-[20px] cursor-pointer hover:text-primary-container transition-colors" title="Terminal Help">help</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="z-10 w-full max-w-md px-margin-mobile mt-20 mb-20">
<!-- Centered Login Card -->
<div class="obsidian-card p-10 md:p-12 flex flex-col items-center relative overflow-hidden">
<!-- Visual Accent for High Security -->
<div class="absolute top-0 right-0 p-4 opacity-20 pointer-events-none">
<span class="material-symbols-outlined text-6xl text-primary-container" data-icon="shield">shield</span>
</div>
<!-- Branding -->
<div class="mb-10 text-center w-full">
<div class="w-16 h-16 bg-primary-container flex items-center justify-center mb-6 mx-auto rounded-sm">
<span class="material-symbols-outlined text-black text-4xl" data-icon="security" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-headline-md text-headline-md text-white mb-2 uppercase tracking-widest">Secure Access</h1>
<div class="inline-flex items-center gap-2 px-3 py-1 bg-white/5 border border-white/10">
<span class="material-symbols-outlined text-[14px] text-primary-container" data-icon="encrypted">encrypted</span>
<p class="font-label-md text-label-md text-white/70 uppercase tracking-tighter">System Level: Tier 1 Auth Required</p>
</div>
</div>
<!-- Login Form -->
<form class="w-full space-y-6" id="admin-login-form">
<div class="space-y-2">
<label class="block font-label-lg text-label-lg text-primary-container uppercase" for="admin-id">Administrator ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-white/50 text-[20px]" data-icon="badge">badge</span>
<input class="w-full bg-black border border-white/20 text-white pl-12 pr-4 py-4 focus:outline-none focus:border-primary-container transition-colors font-body-md placeholder:text-white/20" id="admin-id" placeholder="OS-XXXX-XXXX" required="" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="block font-label-lg text-label-lg text-primary-container uppercase" for="password">Encryption Key</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-white/50 text-[20px]" data-icon="key">key</span>
<input class="w-full bg-black border border-white/20 text-white pl-12 pr-4 py-4 focus:outline-none focus:border-primary-container transition-colors font-body-md placeholder:text-white/20" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="pt-4 flex flex-col gap-4">
<button class="w-full bg-primary-container text-black font-label-lg text-label-lg py-5 gold-button-shadow transition-all hover:brightness-110 active:scale-[0.98] uppercase font-bold tracking-[0.2em] flex items-center justify-center gap-3" type="submit">
                    ESTABLISH LINK <span class="material-symbols-outlined text-[20px]" data-icon="login">login</span>
</button>
<button class="w-full bg-transparent border border-white/20 text-white font-label-lg text-label-lg py-4 hover:bg-white/5 transition-all uppercase tracking-widest flex items-center justify-center gap-3 group" type="button">
<span class="material-symbols-outlined text-[20px] text-primary-container group-hover:scale-110 transition-transform" data-icon="fingerprint">fingerprint</span>
                    Biometric Auth
                </button>
</div>
</form>
<!-- Metadata / Trust Signals -->
<div class="mt-12 pt-8 border-t border-white/5 w-full">
<div class="flex items-center justify-center gap-3 text-white/40 mb-8">
<span class="material-symbols-outlined text-[20px] text-primary-container" data-icon="verified_user">verified_user</span>
<span class="font-label-md text-label-md uppercase tracking-widest">SECURE SSL ENCRYPTION ACTIVE</span>
</div>
<div class="grid grid-cols-2 w-full gap-4">
<div class="bg-black/50 p-4 border border-white/5 text-center">
<p class="font-label-md text-label-md text-white/30 mb-1 uppercase tracking-tighter">Gateway Node</p>
<p class="font-label-lg text-label-lg text-primary-container">OS-PRIME-01</p>
</div>
<div class="bg-black/50 p-4 border border-white/5 text-center">
<p class="font-label-md text-label-md text-white/30 mb-1 uppercase tracking-tighter">Access Region</p>
<p class="font-label-lg text-label-lg text-primary-container">GLOBAL-SEC</p>
</div>
</div>
</div>
</div>
<!-- External Footer Area -->
<div class="mt-10 flex flex-col md:flex-row justify-between items-center gap-6 text-white/20 px-4">
<div class="text-label-md font-label-md uppercase tracking-[0.3em]">
            © 2024 OSTA SECURE SYSTEMS
        </div>
<div class="flex gap-8 font-label-md text-label-md uppercase tracking-widest">
<a class="hover:text-primary-container transition-colors" href="#">Legal</a>
<a class="hover:text-primary-container transition-colors" href="#">Breach Portal</a>
</div>
</div>
</main>
<!-- Bottom Visual Accent -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-primary-container shadow-[0_-5px_15px_rgba(245,189,24,0.3)]"></div>
<script>
    // Micro-interaction for form feedback
    const form = document.getElementById('admin-login-form');
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const btn = form.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML;
        
        btn.disabled = true;
        btn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> INITIALIZING...`;
        
        // Simulate auth delay
        setTimeout(() => {
            btn.innerHTML = `<span class="material-symbols-outlined" data-icon="gpp_bad">gpp_bad</span> PROTOCOL REJECTED`;
            btn.classList.remove('bg-primary-container', 'text-black');
            btn.classList.add('bg-error', 'text-white');
            
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = originalText;
                btn.classList.add('bg-primary-container', 'text-black');
                btn.classList.remove('bg-error', 'text-white');
            }, 2500);
        }, 1800);
    });

    console.log("%c OSTA SECURE TERMINAL V4.1 | STANDBY", "color: #f5bd18; font-weight: bold; font-size: 14px;");
</script>
</body></html>
